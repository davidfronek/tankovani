version: '3.9'

services:
  db:
    image: postgres:16
    container_name: tanko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tanko
    ports:
      - "5432:5432"
    volumes:
      - tanko_db_data:/var/lib/postgresql/data

volumes:
  tanko_db_data:
