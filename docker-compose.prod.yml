services:
  db:
    image: postgres:16
    container_name: tanko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tanko_db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./server
    container_name: tanko-api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-30}
      AUTH_ALLOW_REGISTRATION: ${AUTH_ALLOW_REGISTRATION:-false}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_PASSWORD_RESET_MINUTES: ${AUTH_PASSWORD_RESET_MINUTES:-30}
      AUTH_PASSWORD_RESET_EXPOSE_TOKEN: ${AUTH_PASSWORD_RESET_EXPOSE_TOKEN:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}

  web:
    build:
      context: ./client
    container_name: tanko-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  tanko_db_data:
